data:
  provider: csv
  csv_path: data/example_semiconductors_prices.csv
  tickers: []
  benchmark: MARKET
  start: "2018-01-01"
  end: null

universe:
  source: nasdaq_screener
  industry: Semiconductors
  sector: Technology
  export_path: data/example_nasdaq_semiconductors.csv
  manifest_path: data/universes/example_semiconductors.csv
  refresh_on_run: false
  min_market_cap: 1000000000
  max_symbols: null
  min_snapshot_retention: 0.80
  countries: []
  exclude_name_contains: [Warrant, Right, Unit, Preferred]
  initial_effective_from: "2018-01-01"

features:
  beta_lookback: 60
  breadth_ma_windows: [20, 50]
  trend_lookbacks: [5, 20, 60]
  correlation_lookback: 60
  volatility_lookback: 20
  pca_lookback: 126
  min_constituent_coverage: 0.80

hmm:
  states: 3
  min_train_size: 252
  refit_every: 42
  n_iter: 100
  seeds: [7]

xgboost:
  horizon: 20
  min_train_size: 252
  refit_every: 42
  n_estimators: 80
  max_depth: 3
  learning_rate: 0.04
  subsample: 0.80
  colsample_bytree: 0.80
  random_state: 42

signal:
  bullish_probability: 0.60
  bearish_probability: 0.40
  hmm_probability: 0.50
  bullish_breadth: 0.60
  bearish_breadth: 0.40
