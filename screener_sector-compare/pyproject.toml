[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sector-screener"
version = "0.1.0"
description = "Cached multi-ticker sector correction and rebound screener"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "filelock>=3.13",
  "fastapi>=0.116",
  "hmmlearn>=0.3.2",
  "jinja2>=3.1",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "uvicorn>=0.35",
  "xgboost-cpu>=3.4; platform_system == 'Linux'",
  "xgboost>=2.0; platform_system != 'Linux'",
  "yfinance>=0.2.65",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
qlib = ["pyqlib>=0.9.6"]

[project.scripts]
screener = "sector_screener.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sector_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
